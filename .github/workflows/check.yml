name: check

# CI cannot install Omarchy or Quickshell, so it runs the portable subset:
# manifest sanity, the security invariants from docs/security.md, and the
# structural single-entry-point checks. The full run — `scripts/check` with
# `omarchy plugin validate` and qmllint — happens on a real Omarchy machine
# before a release is tagged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Manifest, safety invariants, structure
        run: ./scripts/check --portable

  tests:
    # Diagnostic tests use pure JS through Qt's QML runner; companion tests use
    # Python's standard library and fake IPC/updaters. Neither needs a running
    # Omarchy/Quickshell session, and neither runs a real system update.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt QML test tooling
        # qmltestrunner pulls in QtTest, which pulls in a chain of QtQuick
        # modules that qt6-declarative-dev-tools does not depend on. Installed
        # best-effort one at a time so a package that is absent or renamed in a
        # future Ubuntu image does not take the whole job down before the
        # runner has had a chance to say what is actually missing.
        run: |
          sudo apt-get update
          for pkg in qt6-declarative-dev-tools \
                     qml6-module-qttest \
                     qml6-module-qtqml \
                     qml6-module-qtqml-workerscript \
                     qml6-module-qtquick \
                     qml6-module-qtquick-window \
                     qml6-module-qtquick-templates \
                     qml6-module-qtquick-controls \
                     qml6-module-qtquick-layouts; do
            sudo apt-get install -y "$pkg" || echo "unavailable: $pkg"
          done

      - name: Run the test suite
        run: |
          QT_BIN=$(dirname "$(command -v qmltestrunner || echo /usr/lib/qt6/bin/qmltestrunner)")
          QT_BIN="$QT_BIN" QT_QPA_PLATFORM=offscreen ./scripts/test
